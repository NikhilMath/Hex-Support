<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex Support</title>
  <meta name="description" content="Your client is 900 years old. His orb just updated. His dead wife wants it in the divorce. A pick-your-path comedy you play in your browser.">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16141a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- The preview LinkedIn, iMessage, Slack and the rest show for a link to
       the site. They need full addresses. tools/site-images.js draws the picture. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hex Support">
  <meta property="og:title" content="Hex Support · A pick-your-path comedy">
  <meta property="og:description" content="Your client is 900 years old. His orb just updated. His dead wife wants it in the divorce.">
  <meta property="og:url" content="https://hex-support.netlify.app/">
  <meta property="og:image" content="https://hex-support.netlify.app/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A glowing crystal ball with a stuck loading spinner and an error box that says “Please... kill me.”, surrounded by ghosts, beside the title Hex Support.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="site-header">
      <p class="site-title">Hex Support</p>
    </header>

    <article id="passage" aria-live="polite">
      <h1 id="passage-title" tabindex="-1"></h1>
      <div id="passage-text"></div>
    </article>

    <nav id="choices" aria-label="Choices"></nav>

    <details class="story-map">
      <summary>Story map</summary>
      <div class="map-scroll">
        <svg id="map-svg" aria-label="Story map"></svg>
      </div>
      <p class="map-legend">
        <span class="legend-item"><span class="key key-current"></span>You are here</span>
        <span class="legend-item"><span class="key key-visited"></span>Visited</span>
        <span class="legend-item"><span class="key key-unvisited"></span>Not yet</span>
        <span class="legend-item"><span class="key key-dead-end"></span><span id="dead-end-count">Dead ends</span></span>
        <span class="legend-item" id="scene-count">Scenes</span>
        <span class="legend-item legend-found" id="endings-found">Endings found</span>
      </p>
    </details>

    <footer class="site-footer">
      <button id="restart" type="button">Start over</button>
      <button id="forget" type="button" class="quiet">Forget where I’ve been</button>
      <p class="footer-note">Your map remembers every scene you’ve read, in this browser only. Start over keeps it.</p>
      <p class="footer-credit">Made by <a href="https://nikhilmath.com">NikhilMath.com</a></p>
    </footer>
  </main>

  <noscript>
    <p class="noscript">This story needs JavaScript turned on to play.</p>
  </noscript>

  <script src="story.js"></script>
  <script src="map.js"></script>
  <script src="game.js"></script>
</body>
</html>
